  deploy:
    runs-on: ubuntu-latest
    #    needs: build-and-push
    
    steps:
      - name: Deploy via SSH
        run: |
          # Thiết lập SSH Key
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Quét key để tránh hỏi "yes/no"
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts
          
          # Chạy lệnh (Nếu là IPv6, bao ngoặc trong command SSH)
          ssh -i ~/.ssh/id_rsa ${{ secrets.USERNAME }}@[${{ secrets.HOST }}] "cd /home/***/sourcecode/nest-api && docker compose pull && docker compose up -d"
