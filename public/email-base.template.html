<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Momo+Signature&family=Momo+Trust+Sans:wght@200..800&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style type="text/tailwindcss">
        @layer base {
            body {
                font-family: 'Momo Trust Sans', sans-serif;
                -webkit-font-smoothing: antialiased;
            }
        }
    </style>
</head>
<body class="bg-white p-6 sm:p-16">

<div class="max-w-[750px] mx-auto">
    <div class="mb-10">
        <img src="{{EMAIL_LOGO_URL}}" alt="Logo" class="block h-10 w-auto"
             style="display: block; max-height: 40px; width: auto;"
        />
    </div>
    <h1 class="text-2xl font-semibold text-gray-900 mb-6"> {{TITLE}} </h1>
    <div class="text-[15px] leading-[1.8] text-gray-700 mb-10">{{CONTENT}}</div>

    <footer class="text-[13px] text-gray-400 border-t border-gray-100 pt-6">
        Trân trọng, <br>
        Đội ngũ <a href="{{APP_URL}}" class="not-italic font-bold text-gray-600 hover:text-blue-600">
        {{APP_NAME}}
    </a>
    </footer>
</div>

</body>
</html>
