syntax = "proto3";

package app_server;

// Common message types
message Response {
  bool success = 1;
  string message = 2;
}

// NLP Labeled Service Messages
message UpdateLabelRequest {
  int32 messageId = 1;
  string systemLabel = 2;
  bool isRemove = 3;
}

// Task Service Messages
message TaskRequest {
  int32 messageId = 1;
}

message Task {
  int32 id = 1;
  int32 messageId = 2;
}

// Inquiry Service Messages
message InquiryRequest {
  int32 messageId = 1;
}

message Inquiry {
  int32 id = 1;
  int32 messageId = 2;
}

// Class Registration Service Messages
message ClassRegistrationRequest {
  int32 messageId = 1;
}

message ClassRegistration {
  int32 id = 1;
  int32 messageId = 2;
}

// Service Definitions
service NlpLabeledService {
  rpc UpdateLabel(UpdateLabelRequest) returns (Response);
}

service TaskService {
  rpc Create(TaskRequest) returns (Task);
}

service InquiryService {
  rpc Create(InquiryRequest) returns (Inquiry);
}

service ClassRegistrationService {
  rpc Create(ClassRegistrationRequest) returns (ClassRegistration);
}
