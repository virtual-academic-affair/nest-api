syntax = "proto3";
package app_server;

import "common.proto";

message InquiryCitation {
  string fileId = 1;
  string displayName = 2;
  string text = 3;
}

message CreateInquiryRequest {
  int32 messageId = 1;
  repeated string types = 2;
  string question = 3;
  string answer = 4;
  repeated InquiryCitation citations = 5;
}

service InquiryService {
  rpc Create(CreateInquiryRequest) returns (app_server.SuccessResponse);
}
